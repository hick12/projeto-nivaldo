{% extends "base.html" %}

{% block titulo %}Entrar — Torra &amp; Terra{% endblock %}

{% block conteudo %}

<form class="formulario-estreito" method="post"
      action="{{ url_for('login', proximo=request.args.get('proximo','')) }}">
  <input type="hidden" name="_csrf" value="{{ token_csrf() }}">
  <h1>Entrar</h1>

  <div class="campo">
    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" value="{{ email or '' }}"
           autocomplete="email" required>
  </div>

  <div class="campo">
    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password"
           autocomplete="current-password" required>
  </div>

  <button class="botao botao-primario" type="submit">Entrar</button>

  <p class="alternativa">
    Ainda não tem conta? <a href="{{ url_for('cadastro') }}">Criar conta</a>
  </p>
</form>

{% endblock %}
